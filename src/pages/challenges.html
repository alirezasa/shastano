    <div class="tw-border-b tw-border-surface-line tw-bg-white">
      <div class="shn-container tw-py-8">
        <nav aria-label="مسیر صفحه" class="tw-text-xs tw-text-ink-muted"><a href="{{root}}index.html" class="hover:tw-text-ocean-700">صفحه اصلی</a> <i class="fa-solid fa-chevron-left tw-mx-1 tw-text-[9px]" aria-hidden="true"></i> <span class="tw-font-bold tw-text-ink">نظام مسائل فناورانه</span></nav>
        <h1 class="tw-mt-3 tw-text-2xl tw-font-bold sm:tw-text-3xl">نظام مسائل فناورانه (RFP)</h1>
        <p class="tw-mt-2 tw-max-w-3xl tw-text-sm tw-leading-7 tw-text-ink-muted">نیازها و چالش‌های احصاشده از شرکت‌های تابعه‌ی شستان. برای هر فراخوان فعال می‌توانید بدون ثبت‌نام طرح پیشنهادی ارسال کنید.</p>
      </div>
    </div>
    <div class="shn-container tw-grid tw-gap-6 tw-py-8 lg:tw-grid-cols-4">
      <aside class="lg:tw-col-span-1">
        <form class="shn-card tw-sticky tw-top-24 tw-space-y-4 tw-p-5" data-shn="filters" role="search" aria-label="فیلتر مسائل">
          <div class="tw-flex tw-items-center tw-justify-between">
            <h2 class="tw-text-sm tw-font-bold"><i class="fa-solid fa-sliders tw-ms-1 tw-text-ink-soft" aria-hidden="true"></i> فیلترها</h2>
            <button type="reset" class="tw-text-xs tw-font-bold tw-text-accent-600 hover:tw-underline">پاک کردن</button>
          </div>
          <div>
            <label for="flt-q" class="shn-label tw-text-xs">جستجو</label>
            <input id="flt-q" name="q" type="search" class="shn-input" placeholder="عنوان، کلیدواژه، کد…">
          </div>
          <div>
            <label for="flt-status" class="shn-label tw-text-xs">وضعیت فراخوان</label>
            <select id="flt-status" name="status" class="shn-input">
              <option value="all">همه</option>
              <option value="open">فقط فراخوان‌های باز</option>
              <option value="Evaluating">در حال ارزیابی</option>
              <option value="Contracted">منجر به قرارداد</option>
              <option value="Closed">بسته شده</option>
            </select>
          </div>
          <div>
            <label for="flt-domain" class="shn-label tw-text-xs">حوزه‌ی تخصصی</label>
            <select id="flt-domain" name="domain" class="shn-input"><option value="all">همه‌ی حوزه‌های ۷گانه</option></select>
          </div>
          <div>
            <label for="flt-company" class="shn-label tw-text-xs">شرکت</label>
            <select id="flt-company" name="company" class="shn-input"><option value="all">همه‌ی شرکت‌ها</option></select>
          </div>
          <div>
            <label for="flt-priority" class="shn-label tw-text-xs">اولویت</label>
            <select id="flt-priority" name="priority" class="shn-input">
              <option value="all">همه</option><option value="Urgent">فوری</option><option value="High">بالا</option><option value="Medium">متوسط</option><option value="Normal">عادی</option>
            </select>
          </div>
        </form>
      </aside>
      <section class="lg:tw-col-span-3" aria-live="polite">
        <div class="tw-mb-4 tw-flex tw-flex-wrap tw-items-center tw-justify-between tw-gap-3">
          <p class="tw-text-sm tw-text-ink-muted" data-shn="result-count">&nbsp;</p>
          <label class="tw-flex tw-items-center tw-gap-2 tw-text-sm">
            <span class="tw-text-ink-muted">مرتب‌سازی:</span>
            <select class="shn-input tw-w-auto tw-py-2" data-shn="sort">
              <option value="newest">جدیدترین</option>
              <option value="deadline">نزدیک‌ترین مهلت</option>
              <option value="title">عنوان</option>
            </select>
          </label>
        </div>
        <div class="tw-grid tw-grid-cols-1 tw-gap-5 md:tw-grid-cols-2 xl:tw-grid-cols-3" data-shn="results"></div>
        <div class="tw-mt-8" data-shn="pager"></div>
      </section>
    </div>
